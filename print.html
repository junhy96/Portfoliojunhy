<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>인쇄 · PDF</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/print.css?v=202611101522" />
</head>
<body>
  <!-- 화면에서만 보이는 막대 (인쇄할 때는 숨김) -->
  <div class="pbar" role="toolbar" aria-label="인쇄">
    <p class="pbar-hint" id="pbar-hint">불러오는 중…</p>
    <div class="pbar-acts">
      <button type="button" class="pbtn primary" id="do-print">인쇄 · PDF로 저장</button>
      <button type="button" class="pbtn" id="do-close">닫기</button>
    </div>
  </div>
  <main class="doc" id="doc" aria-live="polite"></main>
  <script src="js/icons.js?v=202611101522"></script>
  <script type="module" src="js/print.js?v=202611101522"></script>
</body>
</html>
